services:
  auth-service:
    command: npm run dev
    volumes:
      - ./auth-service:/usr/src/app
      - /usr/src/app/node_modules

  register-service:
    command: npm run dev
    volumes:
      - ./register-service:/usr/src/app
      - /usr/src/app/node_modules

  target-service:
    command: npm run dev
    volumes:
      - ./target-service:/usr/src/app
      - /usr/src/app/node_modules

  score-service:
    command: npm run dev
    volumes:
      - ./score-service:/usr/src/app
      - /usr/src/app/node_modules

  clock-service:
    command: npm run dev
    volumes:
      - ./clock-service:/usr/src/app
      - /usr/src/app/node_modules

  mail-service:
    command: npm run dev
    volumes:
      - ./mail-service:/usr/src/app
      - /usr/src/app/node_modules

  read-service:
    command: npm run dev
    volumes:
      - ./read-service:/usr/src/app
      - /usr/src/app/node_modules

  gateway-service:
    command: npm run dev
    volumes:
      - ./gateway-service:/usr/src/app
      - /usr/src/app/node_modules

  frontend-service:
    build:
      context: ./frontend-service
      target: dev
    command: sh -c "npm ci && npm run dev"
    volumes:
      - ./frontend-service:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - "5173:5173"

