server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/auth/ {
        rewrite ^/api/auth/(.*)$ /$1 break;
        proxy_pass http://auth-service:3001/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/register/ {
        rewrite ^/api/register/(.*)$ /$1 break;
        proxy_pass http://register-service:3002/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/target/ {
        rewrite ^/api/target/(.*)$ /$1 break;
        proxy_pass http://target-service:3003/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/score/ {
        rewrite ^/api/score/(.*)$ /$1 break;
        proxy_pass http://score-service:3004/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/clock/ {
        rewrite ^/api/clock/(.*)$ /$1 break;
        proxy_pass http://clock-service:3005/api/clock/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/mail/ {
        rewrite ^/api/mail/(.*)$ /$1 break;
        proxy_pass http://mail-service:3006/mail/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/read/ {
        rewrite ^/api/read/(.*)$ /$1 break;
        proxy_pass http://read-service:3007/read/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /media/uploads/ {
        rewrite ^/media/uploads/(.*)$ /$1 break;
        proxy_pass http://target-service:3003/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

